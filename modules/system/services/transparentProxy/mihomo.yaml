mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
log-level: info
external-controller: 127.0.0.1:9090

mode: rule

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb

proxy-providers:
  coffeecloud:
    type: http
    url: {{ coffeecloud }}
    interval: 7200
    path: ./coffeecloud-nodes.yaml
    override:
      additional-prefix: "[CoffeeCloud] "
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
  xsus:
    type: http
    url: {{ xsus }}
    interval: 7200
    path: ./xsus-nodes.yaml
    override:
      additional-prefix: "[XSUS] "
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
    use:
      - coffeecloud
      - xsus
  - name: AUTO
    type: url-test
    use:
      - coffeecloud
      - xsus
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

rules:
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
